<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Contoso Lab Guide</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  The lab guide: one plain document that the clips show between the live
  screens. It replaced the lab map and the setup map on 2026-11-15.
  Text: guide-data.js. The recorder moves it with window.__mapFocus(target):
    overview | map       the top of the document
    setup:N              setup stop N (1 to 5)          setup:N.M   its piece M
    lab:N                lab stop N (6 to 14)           tile:ID     one piece (ID in guide-data.js)
    delivery             stop 15
  The name __mapFocus stays, so steps.mjs and both recorders need no change.
-->
<style>
  :root { --ink:#1f2328; --soft:#57606a; --line:#d9dee3; --paper:#fff; --desk:#eef0f3; --mark:#fff1b8; --bar:#e8590c;
          --ok:#1a7f37; --okbg:#dafbe1; --built:#0969da; --builtbg:#ddf4ff; --plan:#6e7781; --planbg:#eaeef2; --hand:#9a6700; --handbg:#fff8c5; }
  * { box-sizing: border-box; }
  html { scrollbar-width: none; }
  html::-webkit-scrollbar { display: none; }
  body { margin: 0; background: var(--desk); color: var(--ink); font: 19px/1.55 "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .top { position: sticky; top: 0; z-index: 5; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 28px; background: #fff; border-bottom: 1px solid var(--line); }
  .top .ico { width: 22px; height: 28px; border-radius: 3px; background: #3b7ddd; position: relative; }
  .top .ico::before { content: ""; position: absolute; left: 5px; right: 5px; top: 8px; height: 2px; background: #fff; box-shadow: 0 5px 0 #fff, 0 10px 0 #fff; }
  .top b { font-size: 19px; font-weight: 600; }
  .top span { margin-left: auto; color: var(--soft); font-size: 15px; }
  .top em { font-style: normal; color: var(--soft); font-size: 15px; padding-left: 12px; border-left: 1px solid var(--line); }
  .sheet { width: 1180px; margin: 30px auto 240px; padding: 64px 84px 90px; background: var(--paper); border: 1px solid var(--line); border-radius: 4px; box-shadow: 0 1px 3px rgba(31,35,40,.08); }
  h1 { font-size: 44px; line-height: 1.15; margin: 0 0 6px; letter-spacing: -.01em; }
  .meta { color: var(--soft); font-size: 17px; margin: 0 0 26px; }
  .lead { font-size: 21px; margin: 0 0 30px; max-width: 900px; }
  .toc { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 44px; margin: 0 0 14px; padding: 26px 30px; background: #f6f8fa; border: 1px solid var(--line); border-radius: 8px; }
  .toc h4 { margin: 0 0 10px; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--soft); }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc li { display: flex; gap: 12px; padding: 5px 0; font-size: 18px; }
  .toc li i { font-style: normal; font-weight: 600; min-width: 28px; color: var(--bar); font-variant-numeric: tabular-nums; }
  .toc li small { color: var(--soft); font-size: 15.5px; margin-left: 6px; }
  h2.part { font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--soft); margin: 64px 0 0; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
  section { margin: 0; padding: 34px 0 8px; scroll-margin-top: 70px; }
  .head { padding: 10px 16px 12px; margin: 0 -16px 10px; border-left: 5px solid transparent; border-radius: 4px; transition: background .35s, border-color .35s; }
  .head h3 { margin: 0; font-size: 31px; line-height: 1.2; display: flex; align-items: baseline; gap: 14px; }
  .head h3 i { font-style: normal; color: var(--bar); font-variant-numeric: tabular-nums; }
  .head p { margin: 4px 0 0; font-size: 20px; font-weight: 600; color: var(--soft); }
  .why { margin: 0 0 16px; max-width: 940px; color: #3d444d; }
  table { width: 100%; border-collapse: collapse; font-size: 18px; }
  th { text-align: left; font-size: 13.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--soft); font-weight: 600; padding: 8px 12px; border-bottom: 1px solid var(--ink); }
  td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: top; transition: background .35s; }
  td.n { width: 64px; color: var(--soft); font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.p { width: 290px; font-weight: 600; }
  td.s { width: 150px; white-space: nowrap; }
  td.p small { display: block; font-weight: 400; color: var(--soft); font-size: 14.5px; }
  .chip { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 14px; font-weight: 600; }
  .chip.ran { color: var(--ok); background: var(--okbg); } .chip.built, .chip.code { color: var(--built); background: var(--builtbg); }
  .chip.designed { color: var(--plan); background: var(--planbg); } .chip.hand { color: var(--hand); background: var(--handbg); }
  tr.on td { background: var(--mark); } tr.on td:first-child { box-shadow: inset 5px 0 0 var(--bar); }
  .head.on { background: var(--mark); border-left-color: var(--bar); }
  ul.steps { margin: 6px 0 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 0 40px; }
  ul.steps li { padding: 10px 2px; border-bottom: 1px solid var(--line); font-size: 18px; }
  ul.steps li::before { content: "✓"; color: var(--ok); font-weight: 700; margin-right: 12px; }
  .dim section:not(.cur) { opacity: .42; transition: opacity .35s; } section { transition: opacity .35s; }
</style></head>
<body>
<div class="top"><div class="ico"></div><b>Contoso Lab Guide</b><em>Read only</em><span>Contoso Health Identity Lab</span></div>
<main class="sheet" id="sheet"></main>
<script src="guide-data.js"></script>
<script>
(() => {
  const G = window.GUIDE, $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstChild; };
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const chip = (s) => { const k = /^RAN/i.test(s) ? 'ran' : /^BUILT/i.test(s) ? 'built' : /^DESIGNED/i.test(s) ? 'designed' : /hand/i.test(s) ? 'hand' : 'code'; return `<span class="chip ${k}">${esc(s)}</span>`; };
  const sheet = document.getElementById('sheet');
  const toc = (title, rows) => `<div><h4>${title}</h4><ol>${rows.map((r) => `<li><i>${r.n}</i><span>${esc(r.title)}<small>${esc(r.goal)}</small></span></li>`).join('')}</ol></div>`;
  sheet.appendChild($(`<div id="top">
    <h1>Contoso Lab Guide</h1>
    <p class="meta">Contoso Health Identity Lab · a fictional hospital with 5,000 employees, in a real Microsoft Entra tenant</p>
    <p class="lead">This guide lists each piece of the lab: what it is, and its status. Stops 1 to 5 show how the lab was built. Stops 6 to 15 show the lab in operation, from a hire to a departure.</p>
    <div class="toc">${toc('Setup · how the lab was built', G.setup)}${toc('The lab in operation', [...G.lab, G.delivery])}</div></div>`));
  const head = (s) => `<div class="head"><h3><i>${s.n}</i>${esc(s.title)}</h3><p>${esc(s.goal)}</p></div>`;
  sheet.appendChild($('<h2 class="part">Setup · how the lab was built</h2>'));
  for (const s of G.setup) sheet.appendChild($(`<section id="setup-${s.n}">${head(s)}
    <table><thead><tr><th>No.</th><th>Piece</th><th>What it is</th><th>How</th></tr></thead><tbody>${s.tiles.map((t, k) => `<tr id="setup-${s.n}-${k + 1}"><td class="n">${t.num}</td><td class="p">${esc(t.name)}</td><td>${esc(t.what)}</td><td class="s">${chip(t.how)}</td></tr>`).join('')}</tbody></table></section>`));
  sheet.appendChild($('<h2 class="part">The lab in operation</h2>'));
  for (const s of G.lab) sheet.appendChild($(`<section id="lab-${s.n}">${head(s)}<p class="why">${esc(s.purpose)}</p>
    <table><thead><tr><th>No.</th><th>Piece</th><th>What it is</th><th>Status</th></tr></thead><tbody>${s.tiles.map((t) => `<tr id="tile-${t.id}"><td class="n">${t.num}</td><td class="p">${esc(t.name)}${t.standin ? `<small>Stand-in for ${esc(t.standin)}</small>` : ''}</td><td>${esc(t.what)}</td><td class="s">${chip(t.status)}</td></tr>`).join('')}</tbody></table></section>`));
  const d = G.delivery;
  sheet.appendChild($(`<section id="delivery">${head(d)}<p class="why">${esc(d.purpose)}</p><ul class="steps">${d.steps.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></section>`));

  // ---- the camera: window.__mapFocus(target) -----------------------------------
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const glide = (y, ms = 750) => new Promise((done) => {
    const max = document.documentElement.scrollHeight - innerHeight; y = Math.max(0, Math.min(max, Math.round(y)));
    const y0 = scrollY, t0 = performance.now();
    if (Math.abs(y - y0) < 2) return done();
    const step = (t) => { const k = Math.min(1, (t - t0) / ms), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; scrollTo(0, y0 + (y - y0) * e); k < 1 ? requestAnimationFrame(step) : done(); };
    requestAnimationFrame(step);
  });
  const clear = () => { document.querySelectorAll('.on').forEach((e) => e.classList.remove('on')); document.querySelectorAll('.cur').forEach((e) => e.classList.remove('cur')); document.body.classList.remove('dim'); };
  const TOP = 54 + 26;   // the bar, then some air
  window.__mapFocus = async function (t) {
    t = String(t || 'overview');
    if (t === 'overview' || t === 'map') { clear(); await glide(0); await wait(200); return t; }
    let m, sec, row = null;
    if ((m = /^setup:(\d)(?:\.(\d+))?$/.exec(t))) { sec = document.getElementById(`setup-${m[1]}`); if (m[2]) { row = document.getElementById(`setup-${m[1]}-${m[2]}`); if (!row) throw new Error('no tile ' + t); } }
    else if ((m = /^lab:(\d+)$/.exec(t))) sec = document.getElementById(`lab-${m[1]}`);
    else if ((m = /^tile:(\w+)$/.exec(t))) { row = document.getElementById(`tile-${m[1]}`); if (!row) throw new Error('no tile ' + t); sec = row.closest('section'); }
    else if (t === 'delivery') sec = document.getElementById('delivery');
    else throw new Error('unknown map target ' + t);
    if (!sec) throw new Error('no stop ' + t);
    clear(); sec.classList.add('cur'); document.body.classList.add('dim');
    const top = (el) => el.getBoundingClientRect().top + scrollY;
    let y = top(sec) - TOP;
    // A piece low in a long stop: keep the piece in the middle of the page.
    if (row) { const ry = top(row), view = innerHeight - TOP; if (ry + row.offsetHeight - top(sec) > view * 0.86) y = ry - TOP - view * 0.45; }
    await glide(y);
    (row || sec.querySelector('.head')).classList.add('on');
    await wait(450);
    return t;
  };
})();
</script>
</body></html>
